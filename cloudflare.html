<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
	<meta property="og:site_name" content="502 Server Error" />
	<meta property="og:title" content="Site Offline" />
	<meta property="og:type" content="website" />
	<meta name="twitter:card" content="summary">
	<title>502 - Currently Offline</title>
	<style>
		:root { --card: #0d0d0d; --bg1: #000000; --bg3: #5a0000; --text: #FFFFFF; --border: #e00000; --glow: #e00000; }
		.pp { --card: #0d0d0d; --bg1: #00262b; --bg3: #0a1f4d; --border: #3a8dff; --glow: #00e5f0; }
		.sl { --card: #0d0d0d; --bg1: #1e1b4b; --bg3: #083344; --border: #4f5ee8; --glow: #10b4d6; }
		body { margin: 0; background: linear-gradient(122deg, var(--bg1) 0%, var(--bg3) 86%); color: var(--text); font-family: 'Arimo', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; overflow: hidden; }
		@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } }
		@keyframes pulse { 50% { transform: scale(1.05); } }
		@keyframes fadeInText { from { opacity: 0; } }
		.container { background-color: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 0 10px var(--glow); border: 4px solid var(--border); max-width: 600px; animation: fadeIn 1s ease-out; }
		.logo { display: block; width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin: 0 auto 1rem; }
		h1 { font-size: 6rem; margin: 0; animation: pulse 2s infinite; }
		p { font-size: 1.2rem; margin: 1rem 0; }
		span { font-size: 1.1rem; display: inline-block; animation: fadeInText 1s ease-out; }
		a { color: var(--text); }
		a:hover { text-decoration: none; }
	</style>
	<script>
		var pp = /(^|\.)projectphil\.co\.uk$/.test(location.hostname);
		var sl = /(^|\.)syntaxlabs\.co\.uk$/.test(location.hostname);
		var logo = sl ? 'https://cdn.rabdev.dev/cdn/01a19f78-fa37-70f6-adef-29f491f66516.png' : pp ? 'https://cdn.rabdev.dev/cdn/01a19f78-9df9-75d4-9dca-fde487c2c12d.gif' : 'https://cdn.rabdev.dev/cdn/01a19f78-5ed0-7719-96f4-fd5d87443546.png';
		if (pp) document.documentElement.className = 'pp';
		if (sl) document.documentElement.className = 'sl';
		var ic = document.createElement('link'); ic.rel = 'icon'; ic.href = logo; document.head.appendChild(ic);
	</script>
</head>
<body>
	<div class="container">
		<img class="logo" alt="Logo">
		<script>document.querySelector('.logo').src = logo;</script>
		<h1>OFFLINE</h1>
		<p><span>502 Error</span></p>
		<p>
			Our site is currently offline. We should be back online shortly!
			<br><br>
			<span>If you're the site administrator, consider restarting the server.<br>Reach out to <a id="help" href="https://discord.gg/mdGZb2se2a" target="_blank">RAB Development</a> for help. TESTING</span>
			<script>if (pp) { var h = document.getElementById('help'); h.href = 'https://discord.gg/JeR7jKZJn2'; h.textContent = 'Project Phil'; }
			if (sl) { var h = document.getElementById('help'); h.href = 'https://discord.gg/bVaaVMk9Th'; h.textContent = 'Syntax Labs'; }</script>
		</p>
	</div>
</body>
</html>
